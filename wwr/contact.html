<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Whitewater Rafting Company</title>
  <meta name="description"
    content="Page gives details on how to locate and contact us. There is also a form to fill out to contact us.">
  <meta name="author" content="Taylor Power">
  <link rel="stylesheet" href="styles/contact.css">
</head>

<body>

  <header>
    <img src="images/white-water-rafting.jpg" alt="Logo for White Water Rafting">

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>

    <h1>Whitewater Rafting Company</h1>

    <p>
      123 Main River Street <br>
      Kolob, California <br>
      +1 999 999 9999 <br>
      info@whitewater.com
    </p>

    <section class="map_form">

      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3306.9758047735486!2d-117.3680090175013!3d34.01883200398923!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80dcb2759fefd949%3A0x787068541cf7c3ac!2s123%20Main%20St%2C%20Riverside%2C%20CA%2092501%2C%20USA!5e0!3m2!1sen!2sca!4v1785553402796!5m2!1sen!2sca"
          width="300" height="300" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>

      <form action="#" method="post">

        <div class="form-item">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="Placeholder" required>
        </div>

        <div class="form-item">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Placeholder" required>
        </div>

        <div class="form-item">
          <label>Message Purpose</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="purpose" value="general">
              General Inquiry
            </label>

            <label>
              <input type="radio" name="purpose" value="reservation">
              Reservation Question
            </label>

            <label>
              <input type="radio" name="purpose" value="website">
              Website Suggestion
            </label>
          </div>
        </div>

        <div class="form-item">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Type here"></textarea>
        </div>

        <div class="form-item checkbox-item">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">
            Please subscribe me to the monthly newsletter
          </label>
        </div>

        <button type="submit">Get in Touch!</button>

      </form>

    </section>

    <section class="employees">

      <h2>We Are Here to Serve You</h2>

      <div class="employee-grid">

        <figure>
          <img src="images/Happy-Rafter.jpg" alt="Taylor Power, Owner">
          <figcaption>
            <strong>Taylor Power</strong><br>
            Owner
          </figcaption>
        </figure>

        <figure>
          <img src="images/istockphoto-1067019614-612x612.jpg" alt="John Smith, Senior Guide">
          <figcaption>
            <strong>John Smith</strong><br>
            Senior Guide
          </figcaption>
        </figure>

        <figure>
          <img src="images/Employment3-1.jpg" alt="Sally Brown, Junior Guide">
          <figcaption>
            <strong>Sally Brown</strong><br>
            Junior Guide
          </figcaption>
        </figure>

      </div>

    </section>

  </main>

  <footer>

    <p>© 2026 Whitewater Rafting Company | Taylor Power</p>

    <nav class="socialmedia">
      <a href="https://www.instagram.com/">
        <img src="images/instagram.jpg" alt="Instagram">
      </a>

      <a href="https://www.facebook.com/">
        <img src="images/facebook.jpg" alt="Facebook">
      </a>

      <a href="https://www.youtube.com/">
        <img src="images/youtube.jpg" alt="YouTube">
      </a>
    </nav>

  </footer>

</body>

</html>
