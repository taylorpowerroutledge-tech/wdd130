<body>
    <header>
        <img src="images/white-water-rafting.jpg" alt="Logo for White Water Rafting">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>.
        </nav>
        <h1> Whitewater Rafting Company </h1>
    </header>
    <main>
        <div class="hero">
            <img src="images/hero.jpg"
              alt=" Background image of white water rafting, wave of water">


            <h1> Ride the Rapids! Embrace the Adventure!</h1>

        </div>


        <div class="newsletter-container">

            <form action="#" method="post">
                <h2> Sign up for our newsletter! </h2>
                <div class="newslettername">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="newsletteremail">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <button type="submit">Sign Up</button>
            </form>

            <div class="trips">
                <a href="trips.html" class="btn">View Our Trips</a>
                <p>Explore the trips we offer!</p>
            </div>

        </div>
        <h2>Come and make memories that will last forever</h2>
        <div class="groups">
            <figure>
                <img src="images/rafting47_600.jpg" alt="Hitting a wave while rafting" width="250">
                <figcaption>We offer group bookings. If your are looking for the best team bonding
                    memory we have you covered </figcaption>
            </figure>

            <figure>
                <img src="images/rafting29_600.jpg" alt="Face the tide" width="250">
                <figcaption> Need a fun family outing. Look no further, rafting is on of the best
                    family advertures you can have!</figcaption>
            </figure>
        </div>
